<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">✓</div>
        <span class="brand-name">little list</span>
        <span class="storage-note"><span class="status-dot"></span>Saved</span>
      </div>
      <h1>My things to do</h1>
      <label class="identity">
        <span aria-hidden="true">👋</span>
        <span>I am</span>
        <input id="editor-name" type="text" maxlength="48" autocomplete="name" aria-label="Your name">
      </label>
    </header>

    <section class="task-panel" aria-label="Todo list">
      <form id="new-todo-form" autocomplete="off">
        <input id="new-todo" type="text" placeholder="What do you need to do?" aria-label="New todo" required>
        <div class="form-row">
          <label class="due-label">
            <span aria-hidden="true">📅</span>
            <span>When?</span>
            <input id="new-todo-due" type="date" aria-label="When is it due? (optional)">
          </label>
          <button type="submit"><span aria-hidden="true">＋</span> Add</button>
        </div>
      </form>

      <div class="progress-summary">
        <span id="progress-label">0 of 0 done</span>
        <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
      </div>

      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">📝</div>
        <p id="empty-title" class="empty-title">Nothing here yet</p>
        <p id="empty-message">Type something above and press Add.</p>
      </div>

      <ul id="todo-list" aria-live="polite"></ul>

      <footer id="footer" hidden>
        <span id="count"></span>
        <nav class="filters" aria-label="Show">
          <button type="button" data-filter="all" class="selected">All</button>
          <button type="button" data-filter="active">To do</button>
          <button type="button" data-filter="completed">Done</button>
        </nav>
        <button type="button" id="clear-completed">Clear done</button>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
